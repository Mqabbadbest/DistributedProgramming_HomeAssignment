<header class="header">
  <div class="header-inner">
    <a routerLink="/" class="logo">
      <span class="logo-icon">◆</span>
      <span class="logo-text">MALTA <em>CABS</em></span>
    </a>

    <nav class="nav">
      @if (!isAuthenticated) {
        <a routerLink="/login" class="btn btn-ghost">Login</a>
        <a routerLink="/register" class="btn btn-gold">Register</a>
      } @else {
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-tab">Bookings</a>
        <a routerLink="/locations" routerLinkActive="active" class="nav-tab">Locations</a>

        <div class="profile-menu">
          <button class="profile-btn" (click)="toggleDropdown()" title="Profile">
            <svg
              class="profile-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          @if (isDropdownOpen) {
            <div class="dropdown">
              <button class="dropdown-item" (click)="logout()">
                <svg
                  class="logout-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
              </button>
            </div>
          }
        </div>
      }
    </nav>
  </div>
</header>

<app-header />
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-icon">◆</span>
      <span class="brand-name">MALTA <em>CABS</em></span>
    </div>
    <h2 class="auth-title">Create account</h2>
    <p class="auth-sub">Join Malta's premium cab service</p>
    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="field-row">
        <div class="field">
          <label>First Name</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" placeholder="Jean" required />
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" placeholder="Borg" required />
        </div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" [(ngModel)]="phone" name="phone" placeholder="+356 79894561" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="submit-btn">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</main>
